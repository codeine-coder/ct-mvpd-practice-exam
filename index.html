<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CT MVPD Practice Exam</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:auto;padding:20px;background:#f6f8fb;color:#152238}.q{background:#fff;border:1px solid #d8dfeb;border-radius:12px;padding:18px;margin:16px 0}.choice{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid #bac7da;border-radius:8px;background:#fff;font-size:16px;cursor:pointer;color:#152238!important;-webkit-text-fill-color:#152238!important;opacity:1!important}.choice.correct{background:#dff5e4;border-color:#238636;color:#14532d!important;-webkit-text-fill-color:#14532d!important}.choice.wrong{background:#ffe3e3;border-color:#d1242f;color:#7f1d1d!important;-webkit-text-fill-color:#7f1d1d!important}.feedback{padding:10px;margin-top:10px;background:#eef4ff;border-radius:7px}.hide{display:none}button{padding:13px 18px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin:8px 8px 8px 0}#reset{background:#56657b}#result{background:#fff;border:2px solid #1769e0;border-radius:12px;padding:20px;margin-top:20px;font-size:20px;font-weight:bold}#progress{position:sticky;top:0;background:#f6f8fb;padding:10px 0;font-weight:bold}h1{color:#102d55}</style></head><body><h1>Connecticut MVPD Practice Exam</h1><p>50 original practice questions. Click an answer for instant feedback. Tap Finish Exam for your final percentage.</p><div id="progress">Answered: 0 / 50 | Correct: 0</div><div id="quiz"></div><button id="finish">Finish Exam / Show Percentage</button><button id="reset">Restart</button><div id="result" class="hide"></div><script>const Q=[['Who needs a CT MVPD appraiser license?',['A person appraising auto physical-damage claims as a business for an insurer or third-party claimant','Only an insurer employee','Only body shop owners','Only total-loss specialists'],0,'CT defines MVPD appraisers broadly: people or businesses appraising physical damage for insurers or third-party claimants.'],['Before the CT MVPD exam, what prelicensing education is mandated?',['40 hours','20 hours','None','College degree'],2,'Connecticut says no prelicensing course is required before taking the MVPD exam.'],['After passing, residents generally apply through:',['DMV','NIPR','The repair facility','Connecticut courts'],1,'CT directs residents to NIPR for an initial MVPD application.'],['How long is the CT MVPD license term?',['One year','Two years','Three years','Four years'],1,'The state lists a two-year duration.'],['CT MVPD licenses renew:',['Every April 30','June 30 in odd-numbered years','On the licensee birthday','January 1 every year'],1,'The CT CID MVPD page states renewal June 30 every odd year.'],['Does CT require MVPD continuing education?',['24 hours per cycle','8 hours annually','No CE','Only after a claim complaint'],2,'Connecticut states it does not require CE for appraisers.'],['Which is NOT required for CT MVPD licensure?',['Written exam','License application','Fingerprints','Fee'],2,'CT states MVPD licensing does not require fingerprints.'],['A CT appraiser may require an insured to use a certain body shop:',['Yes, if insurer preferred','Yes, if cheapest','No','Only after two estimates'],2,'CT law protects customer choice of licensed repair facility.'],['An insurer-written estimate must notify the consumer that:',['The insurer selects the shop','The consumer may choose a licensed repair shop','Only OEM parts can be used','Three estimates are mandatory'],1,'CT law requires the customer-choice notice.'],['The best appraisal is:',['Lowest possible','Highest possible','Impartial, accurate, and supported by facts','Whatever the shop requests'],2,'Appraiser conduct requires impartiality.'],['Hidden related damage found after teardown should be handled by:',['Ignoring it','A documented supplement/reinspection or review','Charging customer automatically','Replacing all parts'],1,'Supplements address newly exposed supported related damage.'],['A supplement is:',['A second policy','An estimate revision for additional supported damage/operations','A deductible','A parts discount'],1,'It adds/revises supported work after original estimate.'],['Why document pre-existing damage?',['To inflate value','To separate unrelated condition from the current loss','To total the car','To avoid photos'],1,'This protects all parties by distinguishing unrelated damage.'],['What is a key first inspection step?',['Estimate from one photo','Verify vehicle identity and document visible damage','Order panels','Choose shop'],1,'Correct vehicle identification and documentation are essential.'],['OEM procedures matter because they may:',['Only set paint color','Specify repair restrictions, scans, calibrations, or replacement requirements','Replace an inspection','Set deductibles'],1,'OEM repair information may define required safe operations.'],['A pre-repair scan can help identify:',['Insurance premiums','Stored diagnostic trouble codes','Policy limits','Theft title'],1,'Diagnostic scans can document electronic-system conditions.'],['A post-repair scan/calibration may be needed to:',['Increase bill','Restore/verify electronic and ADAS functions per procedures','Determine fault','Avoid road test'],1,'Safety systems may need verification or calibration after repair.'],['Airbag deployment can involve:',['Cosmetic trim only','SRS components, sensors, restraints, and diagnostics','No safety issue','Automatic total loss always'],1,'Deployment can affect many safety-system components.'],['Unibody construction means:',['Integrated body and structural frame design','No structure','Truck only','All aluminum'],0,'Unibody designs integrate structural elements and body.'],['Structural measurement helps determine:',['Paint color','Whether dimensions meet specification and proper repair is possible','Deductible','Salvage buyer'],1,'Measurement supports assessment of structural condition.'],['OEM part means:',['Part made for vehicle manufacturer','Used part','Aftermarket only','Rental part'],0,'OEM is manufacturer-sourced; aftermarket is non-OEM.'],['Best parts-selection approach:',['Always cheapest','Follow policy, law, repair requirements, availability, condition, and documentation','Always recycled','Always OEM'],1,'Parts choices must be supportable and compliant.'],['Betterment is:',['Paint process','Adjustment for increased value from replacement of worn item where allowed','Total loss fee','Labor rate'],1,'Betterment can apply when replacement improves the owner position under policy/rules.'],['Actual cash value is usually:',['Original MSRP','Pre-loss market value considering condition and relevant factors','Repair cost only','Salvage bid'],1,'ACV is the vehicle value immediately before loss.'],['A total loss is generally based on:',['Airbag deployment alone','Economic/legal threshold compared with value','Owner preference alone','Mileage alone'],1,'It depends on applicable law/policy and repair economics.'],['Salvage value means:',['Cost to repair','Expected value of damaged vehicle after loss','Deductible','New-car value'],1,'Salvage is the damaged vehicle’s expected disposition value.'],['A deductible is:',['Shop profit','Insured portion of a covered first-party loss, subject to policy','Tax fee','Labor rate'],1,'The deductible is the insured’s share before covered payment.'],['Depreciation is:',['Value increase','Value decline from age, wear, condition or obsolescence','Labor charge','Title fee'],1,'Depreciation reflects reduced value.'],['Itemized labor operations help:',['Make estimate longer','Show supported work and permit review','Eliminate photos','Guarantee payment'],1,'Clear labor lines make an estimate auditable.'],['R&I means:',['Repair and inspect','Remove and install','Replace and insure','Refinish and inspect'],1,'R&I is remove and install.'],['R&R means:',['Repair and refinish','Remove and replace','Restore and recalibrate','Review and reject'],1,'R&R is remove and replace.'],['Blend refinish is used to:',['Create different colors','Create gradual color transition to adjacent panel','Avoid clear coat','Skip masking'],1,'Blending can help achieve acceptable color match.'],['If an operation may be included in a labor database allowance, appraiser should:',['Always pay separate','Never pay','Review database notes/procedure pages and actual repair needs','Ignore it'],2,'Verify database inclusion guidance and applicable requirements.'],['Photos are important because they:',['Replace inspection','Document condition, severity, and findings','Set policy limit','Avoid discussion'],1,'Photos support the file but do not replace inspection.'],['A fraud red flag could be:',['Damage consistent with loss','Damage pattern materially inconsistent with reported event','Clean interior','Shop wants estimate copy'],1,'Document objective inconsistencies and follow procedures.'],['Suspected fraud should be handled by:',['Accusing customer','Setting estimate to zero','Documenting facts and escalating through proper procedures','Telling shop to decide'],2,'Do not make unsupported accusations; document and refer.'],['Repair plan purpose:',['List paint color only','Identify supported operations, parts, materials, and procedures','Determine liability','Sell policy'],1,'It maps necessary loss-related work.'],['A reinspection is most appropriate when:',['Appraiser wants a different shop','Newly exposed related damage is documented','Owner changes phone','Vehicle is fully repaired already'],1,'Supported new damage after teardown warrants review.'],['An appraiser should avoid:',['Clear terminology','Unsupported promises about coverage/payment outside authority','Photos','Factual explanation'],1,'Coverage and settlement authority may be outside appraiser role.'],['CT applicants must show:',['Good moral character and financial responsibility','College degree','Five years shop experience','Body shop ownership'],0,'CGS 38a-769 requires satisfactory evidence of moral character and financial responsibility.'],['Licensee must report certain address/email/employer/name changes within:',['10 days','30 days','60 days','One year'],1,'CGS 38a-771 uses 30 days.'],['Willful misrepresentation in CT license application can lead to:',['Fine up to $4,000, imprisonment up to six months, or both','Only retest','No penalty','Automatic renewal'],0,'CGS 38a-772 provides these penalties.'],['Impersonating another person for a CT insurance licensing exam can lead to:',['Fine up to $4,000, imprisonment up to six months, or both','Only an exam reschedule','No penalty','A $50 fee only'],0,'CGS 38a-773 states this penalty.'],['Who may suspend/revoke a license for cause after notice and hearing?',['Repair shop','Insurance Commissioner','Vehicle maker','Customer'],1,'The Insurance Commissioner has that authority.'],['Maximum administrative fine under CGS 38a-774 is:',['$500','$1,000','$5,000','$25,000'],2,'The commissioner may impose a fine not exceeding $5,000.'],['The best example of impartiality is:',['Lower estimate because insurer wants it','Estimate from documented damage/procedures regardless of who benefits','Approve every shop request','Reject all supplements'],1,'Impartial estimates are evidence- and procedure-based.'],['Damaged bumper with failed parking sensor should prompt:',['Paint bumper only','Document sensor and consider diagnostics/repair/calibration per procedures','Assume pre-existing','Ignore electronics'],1,'Bumper damage may affect sensors and ADAS systems.'],['A final estimate quality check should verify:',['VIN, photos, damage, parts, labor, math and notes are consistent','Notes deleted','Total rounded up','Pre-existing damage removed'],0,'Consistency review reduces omissions and errors.'],['Initial CT MVPD license fee is:',['$80','$130','$50','$250'],1,'CT lists $130 initial fee, including non-refundable $50 application fee.'],['MVPD exam preparation should include CT statutes/regulations because the licensing exam tests:',['Only engine rebuilding','Knowledge of insurance, duties/responsibilities, and CT insurance law','Only sales','Only traffic law'],1,'CGS 38a-769 says the examination tests insurance, licensee duties/responsibilities, and applicable CT law.']];let a=0,c=0;const quiz=document.getElementById('quiz');Q.forEach((q,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<b>'+ (i+1)+'. '+q[0]+'</b>';q[1].forEach((x,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+x;b.onclick=()=>{if(d.dataset.done)return;d.dataset.done=1;a++;[...d.querySelectorAll('button')].forEach((z,k)=>{z.disabled=true;if(k===q[2])z.classList.add('correct');if(k===j&&j!==q[2])z.classList.add('wrong')});if(j===q[2])c++;let f=document.createElement('div');f.className='feedback';f.innerHTML='<b>'+ (j===q[2]?'Correct.':'Correct answer: '+String.fromCharCode(65+q[2])+'.')+'</b> '+q[3];d.appendChild(f);document.getElementById('progress').textContent='Answered: '+a+' / 50 | Correct: '+c};d.appendChild(b)});quiz.appendChild(d)});document.getElementById('finish').onclick=()=>{let r=document.getElementById('result');r.className='';let p=Math.round(c/50*100);r.textContent='Final score: '+c+' / 50 = '+p+'%. '+(p>=80?'Strong practice score. Review all misses.':'Keep studying and retake after reviewing missed explanations.')};document.getElementById('reset').onclick=()=>location.reload();</script></body></html>
